<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WISP — projected 3D on a dark wall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101218; }
  /* dark matte wall with a soft pool of projector light in the centre */
  #wall {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(60% 50% at 50% 46%, rgba(120,140,170,.06), transparent 70%),
      linear-gradient(to bottom, #14161d 0%, #101218 60%, #0c0e13 100%);
  }
  #wall::after {  /* faint wall texture */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(92deg, rgba(0,0,0,.02) 0 2px, transparent 2px 9px);
  }
  #c { position: fixed; inset: 0; z-index: 1; display: block; }
  /* soft projection falloff: content feathers into the wall at the edges */
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse 70% 72% at 50% 48%,
                transparent 55%, #101218 90%);
  }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #aeb6c4;
    background: rgba(0,0,0,.35); padding: 10px 12px; border-radius: 8px;
    pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<div id="wall"></div>
<div id="vignette"></div>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// Best honest screen sim: projected 3D light on a dark wall.
// Dark wall, objects glowing on a softly-receding ground, depth from parallax,
// edges feathering into the wall. Mouse = your eye (real head tracking = Stage 1).
//   F = freeze    O = projection on/off (bare wall)
// ---------------------------------------------------------------------------

const WALL = 0x101218;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.domElement.id = 'c';
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(WALL, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(WALL);
scene.fog = new THREE.Fog(WALL, 5, 14);          // distance fades into the wall

const camera = new THREE.PerspectiveCamera();
scene.add(new THREE.AmbientLight(0x6a7488, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(2, 4, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88a0c0, 0.5);
fill.position.set(-3, 1, 2);
scene.add(fill);

// subtle ground grid (depth reference — low contrast, NOT neon)
const grid = new THREE.GridHelper(60, 120, 0x2b3b4d, 0x222e3d);
grid.material.transparent = true; grid.material.opacity = 0.5;
grid.position.y = -1.5;
scene.add(grid);

// clean objects resting on the ground at clear depths
function obj(geo, color, x, z) {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.16, roughness: 0.45, metalness: 0.05
  }));
  m.position.set(x, -1.5 + 0.0, z);  // base near the ground
  return m;
}
const a = obj(new THREE.IcosahedronGeometry(0.7, 1), 0x6fb6c4,  0.2, -3.0); a.position.y = -0.8; scene.add(a);
const b = obj(new THREE.TorusGeometry(0.55, 0.2, 24, 64), 0xd6ad6a, -1.8, -4.5); b.position.y = -0.95; scene.add(b);
const c = obj(new THREE.BoxGeometry(1, 1, 1), 0xc1869c,  1.9, -5.5); c.position.y = -1.0; scene.add(c);
const d = obj(new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32), 0x8fb88a, -1.4, -7.5); d.position.y = -0.9; scene.add(d);
const e = obj(new THREE.DodecahedronGeometry(0.6), 0x9a90b6,  1.3, -9.0); e.position.y = -0.9; scene.add(e);

// --- off-axis projection (the parallax core) ---
const NEAR = 0.1, FAR = 100;
let W = 4, H = 3;
const eye = { x: 0, y: 0, z: 5 };
function applyParallaxProjection() {
  const k = NEAR / eye.z;
  camera.projectionMatrix.makePerspective(
    (-W/2 - eye.x)*k, (W/2 - eye.x)*k, (H/2 - eye.y)*k, (-H/2 - eye.y)*k, NEAR, FAR);
  camera.position.set(eye.x, eye.y, eye.z);
}

let tracking = true;
window.addEventListener('pointermove', ev => {
  if (!tracking) return;
  const nx = (ev.clientX / window.innerWidth)  * 2 - 1;
  const ny = (ev.clientY / window.innerHeight) * 2 - 1;
  eye.x =  nx * W * 0.8; eye.y = -ny * H * 0.8;
});
window.addEventListener('wheel', ev => {
  if (!tracking) return;
  eye.z = Math.min(11, Math.max(3, eye.z + ev.deltaY * 0.004));
}, { passive: true });

window.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === 'f') { tracking = !tracking; if (!tracking) { eye.x = 0; eye.y = 0; eye.z = 5; } }
  if (k === 'o') {
    const c = document.getElementById('c');
    c.style.visibility = (c.style.visibility === 'hidden') ? 'visible' : 'hidden';
  }
});

function resize() {
  const aspect = window.innerWidth / window.innerHeight;
  H = 3; W = H * aspect;
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);
resize();

const hud = document.getElementById('hud');
function tick() {
  requestAnimationFrame(tick);
  applyParallaxProjection();
  renderer.render(scene, camera);
  hud.textContent =
    'WISP — projected 3D on a dark wall\n' +
    'move mouse = eye   scroll = lean   ·   O = projection on/off   F = ' +
      (tracking ? 'freeze' : 'FROZEN') + '\n' +
    '(mouse is the eye; real head tracking is Stage 1)';
}
tick();
</script>
</body>
</html>
